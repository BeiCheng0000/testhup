# TestHub Nginx 配置 - Windows版本
server {
    listen 3000;
    server_name localhost;  # 使用localhost或您的Windows IP
    
    # 日志文件位置
    access_log C:/nginx/logs/testhub.access.log;
    error_log C:/nginx/logs/testhub.error.log;
    
    # 前端静态文件
    location / {
        root E:/wk/wk_python/testhub_platform-main/frontend/dist;  # 替换为实际路径
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # 启用gzip压缩
        gzip on;
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml
            application/xml+rss
            text/javascript;
        gzip_min_length 1000;
        gzip_comp_level 6;
        gzip_vary on;
        
        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    # API请求代理到后端
    location /api/ {
        proxy_pass http://localhost:8000;  # 后端Django服务器地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 媒体文件
    location /media/ {
        alias E:/wk/wk_python/testhub_platform-main/media/;  # 替换为实际路径
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 静态文件
    location /static/ {
        alias E:/wk/wk_python/testhub_platform-main/static_files/;  # 替换为实际路径
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    
    # 安全headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
